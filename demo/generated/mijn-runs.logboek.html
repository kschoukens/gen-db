<!doctype html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mijn runs</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#f5f4ef; --surface:#ffffff; --surface-2:#faf9f5; --text:#1c1f1b; --muted:#5f655c;
  --line:#e2e0d8; --line-strong:#cfccc1;
  --accent:#1d7550; --accent-hover:#175f41; --accent-weak:#e2f0e8; --on-accent:#ffffff;
  --bar:#2f9467; --bar-track:#ecebe4;
  --danger:#b3261e; --danger-hover:#951f19; --danger-weak:#fbeae8; --on-danger:#ffffff;
  --race:#8a5a00; --race-weak:#fbf0d6;
  --focus:#2563eb; --ok-text:#1d7550;
  --radius:14px; --radius-s:9px;
  --shadow:0 1px 2px rgba(20,20,10,.05), 0 2px 10px rgba(20,20,10,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111311; --surface:#1a1d1a; --surface-2:#161916; --text:#e8ebe5; --muted:#a1a89e;
    --line:#2c312c; --line-strong:#3c423b;
    --accent:#5cc28f; --accent-hover:#79d1a4; --accent-weak:#1d3529; --on-accent:#0b1a12;
    --bar:#4fb683; --bar-track:#262b26;
    --danger:#ff8c82; --danger-hover:#ffa79f; --danger-weak:#3a1d1a; --on-danger:#2a0c09;
    --race:#f0c060; --race-weak:#3a2f14;
    --focus:#8ab4ff; --ok-text:#79d1a4;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  overflow-x:hidden}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 48px}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:1.6rem;letter-spacing:-.01em}
h2{font-size:1.08rem}
.sub{margin:4px 0 0;color:var(--muted)}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;min-width:0}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.card-head p{margin:0;color:var(--muted);font-size:.88rem}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* Summary */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.tile .k{color:var(--muted);font-size:.85rem}
.tile .v{font-size:1.7rem;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v small{font-size:.95rem;font-weight:500;color:var(--muted);margin-left:3px}
@media (max-width:520px){
  .tiles{gap:8px}
  .tile{padding:10px 12px}
  .tile .v{font-size:1.25rem}
  .tile .v small{font-size:.8rem}
  .tile .k{font-size:.78rem}
}

.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}

/* Months */
.months{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.month{display:grid;grid-template-columns:minmax(90px,8.5em) minmax(0,1fr);gap:4px 12px;align-items:center;width:100%;
  text-align:left;background:none;border:1px solid transparent;border-radius:var(--radius-s);padding:8px 10px;color:inherit;font:inherit}
button.month{cursor:pointer}
button.month:hover{background:var(--surface-2);border-color:var(--line)}
button.month[aria-pressed="true"]{background:var(--accent-weak);border-color:var(--accent)}
.month .m-name{font-weight:600;text-transform:capitalize}
.month .m-bar{display:flex;align-items:center;gap:10px;min-width:0}
.track{display:block;flex:1;height:10px;border-radius:6px;background:var(--bar-track);overflow:hidden;min-width:30px}
.fill{display:block;height:100%;background:var(--bar);border-radius:6px;min-width:2px}
.m-val{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;min-width:5.5em;text-align:right}
.m-meta{grid-column:2;color:var(--muted);font-size:.84rem;font-variant-numeric:tabular-nums}
@media (max-width:420px){
  .month{grid-template-columns:minmax(0,1fr)}
  .m-meta{grid-column:1}
}

/* Form */
form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.span2{grid-column:1 / -1}
@media (max-width:400px){form{grid-template-columns:minmax(0,1fr)}.fld{grid-column:1 / -1}}
label,.legend{font-weight:600;font-size:.9rem}
.opt{font-weight:400;color:var(--muted)}
input[type=text],input[type=date],select{
  width:100%;min-width:0;font:inherit;color:var(--text);background:var(--surface);
  border:1px solid var(--line-strong);border-radius:var(--radius-s);padding:9px 11px;min-height:42px}
input:hover,select:hover{border-color:var(--muted)}
input[aria-invalid="true"],select[aria-invalid="true"],.seg[aria-invalid="true"]{border-color:var(--danger)}
input:disabled,select:disabled{opacity:.6}
.unit-wrap{position:relative;display:flex}
.unit-wrap input{padding-right:46px}
.unit{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:.9rem}
.hint{color:var(--muted);font-size:.82rem;margin:0}
.err{color:var(--danger);font-size:.84rem;margin:0}
.err:empty{display:none}
.err .repair{display:block;color:var(--text);opacity:.85}
fieldset{border:0;margin:0;padding:0;min-width:0}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:var(--radius-s);overflow:hidden;margin-top:5px}
.seg label{flex:1;position:relative;font-weight:500;text-align:center;cursor:pointer;min-width:0}
.seg label+label{border-left:1px solid var(--line-strong)}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;padding:9px 4px;min-height:40px;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg input:checked+span{background:var(--accent-weak);color:var(--text);font-weight:650;box-shadow:inset 0 -3px 0 var(--accent)}
.seg input:focus-visible+span{outline:2px solid var(--focus);outline-offset:-3px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:600;cursor:pointer}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.count{font-variant-numeric:tabular-nums}
.count.over{color:var(--danger)}
.form-foot{grid-column:1 / -1;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.preview{color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}
.form-msg{grid-column:1 / -1;margin:0;border-radius:var(--radius-s);padding:10px 12px;font-size:.9rem}
.form-msg:empty{display:none}
.form-msg.bad{background:var(--danger-weak);color:var(--danger)}
.form-msg.bad .repair{display:block;color:var(--text)}
.form-msg.good{background:var(--accent-weak);color:var(--ok-text)}

.btn{font:inherit;font-weight:600;border-radius:var(--radius-s);padding:9px 16px;min-height:42px;cursor:pointer;border:1px solid transparent}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--line-strong)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger-quiet{background:transparent;color:var(--danger);border-color:transparent;padding:6px 10px;min-height:36px}
.btn-danger-quiet:hover:not(:disabled){background:var(--danger-weak)}
.btn-danger{background:var(--danger);color:var(--on-danger)}
.btn-danger:hover{background:var(--danger-hover)}
.btn:disabled{cursor:not-allowed;opacity:.55}
.btn[aria-busy="true"]{opacity:.7;cursor:progress}
.btn-sm{min-height:34px;padding:5px 12px;font-size:.88rem}

/* Runs */
.runs-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:6px}
.runs-head .meta{color:var(--muted);font-size:.88rem}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-weak);border-radius:999px;padding:3px 4px 3px 12px;font-size:.86rem}
.chip span{text-transform:capitalize}
.chip button{font:inherit;font-size:.82rem;border:0;background:var(--surface);color:var(--text);border-radius:999px;padding:3px 10px;cursor:pointer}
.runs{list-style:none;margin:0;padding:0}
.run{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(220px,1.4fr) minmax(0,2.2fr) auto;gap:10px 18px;align-items:start;
  padding:14px 4px;border-top:1px solid var(--line)}
.run:first-child{border-top:0}
.run.removing{opacity:.45}
.r-date time{font-weight:650;display:block}
.r-date .dow{color:var(--muted);font-size:.85rem;text-transform:capitalize}
.badge{display:inline-block;margin-top:4px;font-size:.76rem;font-weight:650;color:var(--race);background:var(--race-weak);border-radius:999px;padding:1px 9px}
.stats{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:0 18px;margin:0}
.stats div{min-width:0}
.stats dt{color:var(--muted);font-size:.76rem}
.stats dd{margin:0;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.stats .big{font-size:1.15rem}
.edits{display:grid;grid-template-columns:minmax(96px,9em) minmax(0,1fr);gap:8px 10px;min-width:0}
.edits .lab-row{display:flex;justify-content:space-between;gap:6px;font-size:.76rem}
.edits .lab-row label{font-size:.76rem;font-weight:500;color:var(--muted)}
.edits select,.edits input[type=text]{min-height:36px;padding:6px 9px;font-size:.92rem}
.edits input[type=text]{background:transparent;border-color:var(--line)}
.edits input[type=text]:hover{border-color:var(--line-strong)}
.edits input[type=text]:focus{background:var(--surface)}
.status{font-weight:500;color:var(--muted)}
.status.saved{color:var(--ok-text)}
.status.bad{color:var(--danger)}
.edit-off{grid-column:1 / -1;color:var(--muted);font-size:.82rem;margin:0}
.r-act{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:0;max-width:220px}
.reason{color:var(--muted);font-size:.8rem;text-align:right;margin:0}
.confirm{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--danger-weak);border-radius:var(--radius-s);padding:10px 12px}
.confirm p{margin:0;flex:1 1 220px;font-size:.9rem}
.confirm .btns{display:flex;gap:8px}
.r-err{grid-column:1 / -1}
@media (max-width:900px){
  .run{grid-template-columns:minmax(0,1fr) auto;}
  .r-date{grid-column:1}
  .r-act{grid-column:2;grid-row:1}
  .stats{grid-column:1 / -1}
  .edits{grid-column:1 / -1}
}
@media (max-width:420px){
  .edits{grid-template-columns:minmax(0,1fr)}
  .stats{gap:0 14px}
}
.empty{color:var(--muted);text-align:center;padding:26px 8px;margin:0}
.loading{color:var(--muted)}
.section-gap{margin-top:16px}
.fatal{background:var(--danger-weak);color:var(--danger);border-radius:var(--radius);padding:14px 16px;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Mijn runs</h1>
    <p class="sub" id="intent"></p>
  </header>

  <div id="fatal" class="fatal" hidden></div>

  <section aria-labelledby="tiles-h">
    <h2 id="tiles-h" class="vh">Totalen</h2>
    <div class="tiles" id="tiles" aria-busy="true"></div>
  </section>

  <div class="cols">
    <section class="card" id="log-card" aria-labelledby="log-h">
      <div class="card-head"><h2 id="log-h"></h2><p id="log-desc"></p></div>
      <form id="log-form" novalidate></form>
    </section>

    <section class="card" id="month-card" aria-labelledby="month-h">
      <div class="card-head"><h2 id="month-h">Per maand</h2><p id="month-hint"></p></div>
      <div id="months"><p class="loading">Laden…</p></div>
    </section>
  </div>

  <section class="card section-gap" aria-labelledby="runs-h">
    <div class="runs-head">
      <h2 id="runs-h">Alle runs</h2>
      <span class="meta" id="runs-meta"></span>
      <span id="filter-chip"></span>
    </div>
    <ol class="runs" id="runs"></ol>
    <p class="empty" id="runs-empty">Laden…</p>
  </section>

  <div class="vh" aria-live="polite" id="live"></div>
</div>

<script>
(function () {
  'use strict';

  /* ---------- Contract ---------- */
  var S = window.surface;
  var C = (S && S.contract) || {};
  var FIELDS = Array.isArray(C.fields) ? C.fields : [];
  var F = {}; FIELDS.forEach(function (f) { F[f.name] = f; });
  var ACTIONS = Array.isArray(C.actions) ? C.actions : [];
  function findAction(pred) { for (var i = 0; i < ACTIONS.length; i++) if (pred(ACTIONS[i])) return ACTIONS[i]; return null; }
  var A_LOG = findAction(function (a) { return a.kind === 'create' && a.scope === 'collection'; });
  var A_DEL = findAction(function (a) { return a.kind === 'delete' && a.scope === 'row'; });
  var A_EDIT = findAction(function (a) { return a.name === '$edit'; });
  var EDIT_PARAMS = (A_EDIT && A_EDIT.params) || [];
  var ATTR = {};
  FIELDS.forEach(function (f) { if (f.attr) ATTR[f.attr] = f.name; });
  ACTIONS.forEach(function (a) { (a.params || []).forEach(function (p) { if (p.attr && !ATTR[p.attr]) ATTR[p.attr] = p.name; }); });

  var SUM = C.summary || null;
  var MEASURES = (SUM && Array.isArray(SUM.measures)) ? SUM.measures : [];
  function measure(pred) { for (var i = 0; i < MEASURES.length; i++) if (pred(MEASURES[i])) return MEASURES[i]; return null; }
  var M_PRIMARY = measure(function (m) { return m.fn === 'sum'; }) || MEASURES[0] || null;

  var FD = F.date ? 'date' : null;
  var FKM = F.distance_km ? 'distance_km' : null;
  var FMIN = F.minutes ? 'minutes' : null;
  var FRACE = (F.race && F.race.type === 'boolean') ? 'race' : null;

  /* ---------- Helpers ---------- */
  function $(id) { return document.getElementById(id); }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k) || attrs[k] == null || attrs[k] === false) continue;
      if (k === 'class') n.className = attrs[k];
      else if (k === 'text') n.textContent = attrs[k];
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] === true) n.setAttribute(k, '');
      else n.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c == null) return; n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  var uid = 0; function nid(p) { uid += 1; return (p || 'x') + '-' + uid; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function todayISO() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  var nfCache = {};
  function num(v, maxFd) {
    var k = maxFd == null ? 2 : maxFd;
    if (!nfCache[k]) nfCache[k] = new Intl.NumberFormat('nl-BE', { maximumFractionDigits: k });
    return nfCache[k].format(v);
  }
  function isNum(v) { return typeof v === 'number' && isFinite(v); }
  function withUnit(v, unit, maxFd) { return isNum(v) ? num(v, maxFd) + (unit ? ' ' + unit : '') : '—'; }
  function parseDate(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function fmtDate(s, opts) { var d = parseDate(s); return d ? d.toLocaleDateString('nl-BE', opts) : (s ? String(s) : '—'); }
  var MONTH_RE = /^(\d{4})-(\d{2})$/;
  function monthLabel(key) {
    var m = MONTH_RE.exec(key == null ? '' : String(key));
    if (!m) return key == null || key === '' ? 'Onbekend' : String(key);
    return new Date(+m[1], +m[2] - 1, 1).toLocaleDateString('nl-BE', { month: 'long', year: 'numeric' });
  }
  function paceText(min, km) {
    if (!isNum(min) || !isNum(km) || km <= 0 || min <= 0) return null;
    var s = Math.round(min / km * 60);
    return Math.floor(s / 60) + ':' + pad(s % 60) + ' /km';
  }
  function durationText(min, unit) {
    if (!isNum(min)) return '—';
    if (min < 60) return withUnit(min, unit || 'min', 1);
    var h = Math.floor(min / 60), r = Math.round((min - h * 60) * 10) / 10;
    return h + ' u' + (r ? ' ' + num(r, 1) + ' ' + (unit || 'min') : '');
  }
  function cap(s) { s = String(s); return s.charAt(0).toUpperCase() + s.slice(1); }
  function parseNum(s) {
    s = String(s == null ? '' : s).replace(/\s/g, '').replace(',', '.');
    if (s === '') return null;
    if (!/^-?(\d+(\.\d*)?|\.\d+)$/.test(s)) return NaN;
    return parseFloat(s);
  }
  function numForInput(v) { return isNum(v) ? String(v).replace('.', ',') : ''; }
  function announce(msg) { var l = $('live'); l.textContent = ''; setTimeout(function () { l.textContent = msg; }, 30); }
  function unitOf(name) { return F[name] && F[name].unit; }

  /* Field error rendering, shared by the log form and in-place edits */
  function clearFieldError(slot) {
    if (!slot) return;
    slot.err.textContent = '';
    slot.controls.forEach(function (c) { c.removeAttribute('aria-invalid'); });
  }
  function addFieldError(slot, message, repair) {
    var p = el('span', { style: 'display:block' }, [message || 'Deze waarde is niet geldig.']);
    if (repair) p.appendChild(el('span', { class: 'repair', text: 'Oplossing: ' + repair }));
    slot.err.appendChild(p);
    slot.controls.forEach(function (c) { c.setAttribute('aria-invalid', 'true'); });
  }
  /* Distributes an error over field slots; returns what could not be placed next to a field. */
  function placeError(error, slots) {
    var left = [];
    var vs = (error && Array.isArray(error.violations)) ? error.violations : [];
    vs.forEach(function (v) {
      var names = v.field ? [v.field] : (v.attributes || []).map(function (a) { return ATTR[a]; });
      names = names.filter(function (n, i) { return n && slots[n] && names.indexOf(n) === i; });
      if (!names.length) { left.push(v); return; }
      names.forEach(function (n) { addFieldError(slots[n], v.message, v.repair); });
    });
    return { placed: vs.length - left.length, left: left };
  }
  function errorBlock(error, left) {
    var box = document.createDocumentFragment();
    var items = left && left.length ? left : null;
    if (items) {
      items.forEach(function (v) {
        var d = el('span', { style: 'display:block' }, [v.message || error.message || 'De database weigerde dit.']);
        if (v.repair) d.appendChild(el('span', { class: 'repair', text: 'Oplossing: ' + v.repair }));
        box.appendChild(d);
      });
    } else {
      box.appendChild(el('span', { style: 'display:block' }, [(error && error.message) || 'De database weigerde dit.']));
      if (error && error.repair) box.appendChild(el('span', { class: 'repair', text: 'Oplossing: ' + error.repair }));
    }
    if (error && Array.isArray(error.didYouMean) && error.didYouMean.length) {
      box.appendChild(el('span', { class: 'repair', text: 'Bedoelde je: ' + error.didYouMean.join(', ') + '?' }));
    }
    return box;
  }
  function networkError(e) {
    return { message: 'Er ging iets mis bij het versturen.', repair: 'Probeer het opnieuw.' + (e && e.message ? ' (' + e.message + ')' : '') };
  }

  /* ---------- Header ---------- */
  if (C.label) { $('title').textContent = C.label; document.title = C.label; }
  $('intent').textContent = C.intent || (C.entity && C.entity.description) || '';
  if (SUM && SUM.by && SUM.by.label) $('month-h').textContent = SUM.by.label;

  if (!S || typeof S.subscribe !== 'function') {
    var fe = $('fatal'); fe.hidden = false;
    fe.textContent = 'De gegevens zijn niet beschikbaar: er is geen verbinding met het logboek.';
  }

  /* ---------- Log form ---------- */
  var form = $('log-form');
  var formSlots = {};
  var formMsg, submitBtn, previewEl;

  function buildForm() {
    if (!A_LOG) {
      $('log-card').hidden = true;
      return;
    }
    $('log-h').textContent = A_LOG.label || 'Nieuwe run';
    $('log-desc').textContent = A_LOG.description || '';
    var params = A_LOG.params || [];
    params.forEach(function (p) {
      var id = nid('f-' + p.name), errId = id + '-err', hintId = id + '-hint';
      var optional = !p.required ? el('span', { class: 'opt', text: ' (optioneel)' }) : null;
      var wrap, controls = [], hint = null, errEl = el('p', { class: 'err', id: errId, 'aria-live': 'polite' });
      var describedBy = errId;

      if (p.type === 'enum') {
        wrap = el('fieldset', { class: 'fld span2' });
        var legendId = id + '-legend';
        wrap.appendChild(el('legend', { class: 'legend', id: legendId }, [p.label, optional]));

  function updatePreview() {

  function clearFormErrors() {

  }

  function validateLocally() {
    var bad = [];
    Object.keys(formSlots).forEach(function (k) {
      var s = formSlots[k], p = s.p, v = s.read();
      if (v === null) { if (p.required) bad.push([k, p.label + ' is verplicht.', null]); return; }
      if (p.type === 'number') {
        if (!isNum(v)) bad.push([k, 'Vul een getal in, bijvoorbeeld ' + (isNum(p.example) ? num(p.example) : '8,4') + '.', null]);
        else if (isNum(p.min) && v < p.min) bad.push([k, 'Minstens ' + withUnit(p.min, p.unit) + '.', null]);
        else if (isNum(p.max) && v > p.max) bad.push([k, 'Hoogstens ' + withUnit(p.max, p.unit) + '.', null]);
      } else if (p.type === 'date') {
        if (!parseDate(v)) bad.push([k, 'Kies een geldige datum.', null]);
      } else if (p.type === 'string' && isNum(p.maxLength) && v.length > p.maxLength) {

  var submitting = false;

          var d = params[FD], km = params[FKM];

  function focusFirstInvalid() {

  /* ---------- Summary ---------- */

  var activeMonth = null;

    var box = $('months'); box.textContent = '';

    if (!groups.length) { box.appendChild(el('p', { class: 'empty', text: 'Nog geen maanden om te tonen.' })); $('month-hint').textContent = ''; return; }
    var allMonths = groups.every(function (g) { return MONTH_RE.test(String(g.key)); });
    if (allMonths) groups.sort(function (a, b) { return String(b.key).localeCompare(String(a.key)); });
    if (activeMonth && !groups.some(function (g) { return String(g.key) === activeMonth; })) setFilter(null);
    $('month-hint').textContent = allMonths ? 'Kies een maand om de runs te filteren' : '';
    var pm = M_PRIMARY;

    var list = el('ul', { class: 'months' });

  /* ---------- Runs list ---------- */
  var runsEl = $('runs');

  function makeEditor(view, p) {
    var id = nid('e-' + p.name), errId = id + '-err';

    } else if (p.type === 'boolean') {
      control = el('select', { id: id }, [el('option', { value: '', text: '—' }), el('option', { value: 'true', text: 'Ja' }), el('option', { value: 'false', text: 'Nee' })]);
    } else if (p.type === 'date') {
      control = el('input', { type: 'date', id: id });
    } else {
      control = el('input', { type: 'text', id: id, autocomplete: 'off',

        maxlength: isNum(p.maxLength) ? p.maxLength : null,

    var isText = control.tagName === 'INPUT' && control.type === 'text';
    var statusTimer = null;
    function setStatus(t, cls) { clearTimeout(statusTimer); status.textContent = t; status.className = 'status' + (cls ? ' ' + cls : ''); }

    function read() {
      var raw = control.value;
      if (p.type === 'boolean') return raw === '' ? null : raw === 'true';
      if (p.type === 'number') return parseNum(raw);
      var v = String(raw).trim(); return v === '' ? null : v;
    }

    }
    ed.write = write;
    function send() {
      var v = read();
      if (p.type === 'number' && v !== null && !isNum(v)) { clearFieldError(ed); addFieldError(ed, 'Vul een getal in.'); return; }
      if (p.type === 'string' && v !== null && isNum(p.maxLength) && v.length > p.maxLength) { clearFieldError(ed); addFieldError(ed, 'Hoogstens ' + p.maxLength + ' tekens.'); return; }
      if (v === ed.server && !ed.pending) { ed.dirty = false; clearFieldError(ed); setStatus(''); return; }
      if (ed.pending && v === ed.sentValue) return;
      var params = {}; params[p.name] = v;
      ed.pending = true; ed.sentValue = v; setStatus('Bewaren…');
      clearFieldError(ed);
      Promise.resolve().then(function () { return S.act(A_EDIT.name, { id: view.id, params: params }); })
        .then(function (res) {
          ed.pending = false;
          if (read() !== v) return; // user kept typing; a newer change will follow

  function describeRun(v) {

    return parts.join(', ');
  }

  function updateRowView(view, row) {

    var v = row.values || {};
    var d = v[FD];

    if (parseDate(d)) view.time.setAttribute('datetime', d); else view.time.removeAttribute('datetime');
    view.dow.textContent = parseDate(d) ? fmtDate(d, { weekday: 'long' }) : '';
    view.badge.hidden = !(FRACE && v[FRACE] === true);
    view.statKm.textContent = withUnit(v[FKM], unitOf(FKM));
    view.statMin.textContent = durationText(v[FMIN], unitOf(FMIN));
    view.statPace.textContent = paceText(v[FMIN], v[FKM]) || '—';

    var actions = row.actions || {};

    if (!editEnabled && ea && ea.reason) { view.editOff.hidden = false; view.editOff.textContent = 'Aanpassen niet mogelijk: ' + ea.reason; }
    else view.editOff.hidden = true;

  }

  function openConfirm(view) {

    view.okBtn.disabled = true; view.okBtn.setAttribute('aria-busy', 'true'); view.cancelBtn.disabled = true;
    var label = describeRun((view.row && view.row.values) || {});
    Promise.resolve().then(function () { return S.act(A_DEL.name, { id: view.id }); })
      .then(function (res) {
        if (res && res.ok) {
          view.li.classList.add('removing');
          announce('Run van ' + label + ' verwijderd.');
          // The row disappears when the next data update arrives.
        } else fail((res && res.error) || {});
      }, function (err) { fail(networkError(err)); })
      .then(function () {
        view.busy = false;
        view.okBtn.disabled = false; view.okBtn.removeAttribute('aria-busy'); view.cancelBtn.disabled = false;
      });
    function fail(error) {
      closeConfirm(view, false);
      view.rowErr.textContent = '';
      view.rowErr.appendChild(el('strong', { text: 'Niet verwijderd. ' }));
      view.rowErr.appendChild(errorBlock(error, error.violations));
      if (view.delBtn && !view.delBtn.disabled) view.delBtn.focus();
    }
  }

  function renderRows(result) {
    var rows = Array.isArray(result.rows) ? result.rows : [];
    var seen = {};
    rows.forEach(function (row, i) {
      if (!row || row.id == null) return;
      var key = String(row.id);
      seen[key] = true;
      var view = rowViews[key];
      if (!view) { view = createRowView(row); rowViews[key] = view; }
      updateRowView(view, row);
      var at = runsEl.children[i];
      if (at !== view.li) runsEl.insertBefore(view.li, at || null);
    });
    Object.keys(rowViews).forEach(function (k) {
      if (!seen[k]) { var v = rowViews[k]; if (v.li.parentNode) v.li.parentNode.removeChild(v.li); delete rowViews[k]; }
    });
    applyFilter();
  }

  function setFilter(key) {
    activeMonth = key;
    if (lastResult) renderMonths(lastResult.summary);
    applyFilter();
  }
  function applyFilter() {
    var shown = 0, totalShown = 0;
    Object.keys(rowViews).forEach(function (k) {
      var v = rowViews[k], d = v.row && v.row.values ? v.row.values[FD] : null;
      var vis = !activeMonth || (typeof d === 'string' && d.slice(0, 7) === activeMonth);
      v.li.hidden = !vis; totalShown++; if (vis) shown++;
    });
    var chip = $('filter-chip'); chip.textContent = '';
    if (activeMonth) {
      chip.appendChild(el('span', { class: 'chip' }, [el('span', { text: monthLabel(activeMonth) }),
        el('button', { type: 'button', text: 'Toon alle runs', onclick: function () { setFilter(null); } })]));
    }
    var total = lastResult && isNum(lastResult.total) ? lastResult.total : totalShown;
    var meta = $('runs-meta');
    if (activeMonth) meta.textContent = shown + (shown === 1 ? ' run' : ' runs') + ' in deze maand';
    else if (totalShown < total) meta.textContent = totalShown + ' van ' + total + ' runs getoond';
    else meta.textContent = total + (total === 1 ? ' run' : ' runs');
    var empty = $('runs-empty');
    if (!totalShown) {
      empty.hidden = false;
      empty.textContent = A_LOG ? 'Nog geen runs in je logboek. Log je eerste run met “' + (A_LOG.label || 'Run loggen') + '”.' : 'Nog geen runs in je logboek.';
    } else if (!shown) {
      empty.hidden = false; empty.textContent = 'Geen runs in deze maand.';
    } else empty.hidden = true;
  }

  /* ---------- Wire up ---------- */
  buildForm();
  if (S && typeof S.subscribe === 'function') {
    S.subscribe(function (result) {
      result = result || {};
      lastResult = result;
      try {
        renderTiles(result.summary);
        renderMonths(result.summary);
        renderRows(result);
      } catch (e) {
        var fe = $('fatal'); fe.hidden = false; fe.textContent = 'Er ging iets mis bij het tonen van de gegevens. ' + (e && e.message ? e.message : '');
      }
    });
  } else {
    renderTiles(null); renderMonths(null); renderRows({ rows: [], total: 0 });
  }
})();
</script>
</body>
</html>
